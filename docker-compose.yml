version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geospatial_measurement_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - MAX_UPLOAD_SIZE_MB=50
      - DATABASE_URL=sqlite:///./data/geospatial.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
